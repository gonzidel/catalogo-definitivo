<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Productos Incompletos | Admin</title>
  <link rel="stylesheet" href="../styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      min-height: 100vh;
      padding: 12px;
      color: #333;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .page-header {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .page-header h1 {
      margin: 0 0 12px 0;
      font-size: 24px;
      font-weight: 700;
      color: #2c3e50;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-header h1::before {
      content: "⚠️";
      font-size: 28px;
    }
    @media (min-width: 768px) {
      body {
        padding: 20px;
      }
      .page-header {
        padding: 32px;
        margin-bottom: 32px;
      }
      .page-header h1 {
        font-size: 32px;
      }
      .page-header h1::before {
        font-size: 36px;
      }
    }
    .nav-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding: 16px 0;
      border-top: 1px solid #e9ecef;
      margin-top: 16px;
    }
    .nav-bar a {
      padding: 10px 18px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      text-decoration: none;
      color: #495057;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.3s ease;
      background: white;
    }
    .nav-bar a:hover {
      border-color: #CD844D;
      color: #CD844D;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(205, 132, 77, 0.15);
    }
    .section-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .section-card h2 {
      margin: 0 0 16px 0;
      font-size: 20px;
      font-weight: 600;
      color: #2c3e50;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
    }
    /* Acordeón de productos */
    .product-accordion {
      margin-bottom: 12px;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      background: white;
      overflow: hidden;
    }
    .accordion-header {
      width: 100%;
      padding: 16px;
      background: #fafafa;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      transition: all 0.2s ease;
      font-family: 'Poppins', sans-serif;
    }
    .accordion-header:hover {
      background: #f0f0f0;
    }
    .accordion-header.expanded {
      background: #e8f4f8;
      border-bottom: 1px solid #e9ecef;
    }
    .accordion-header-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .accordion-title-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .accordion-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #2c3e50;
      line-height: 1.3;
    }
    .accordion-supplier {
      font-size: 13px;
      color: #6c757d;
      font-weight: 500;
    }
    .accordion-colors-badge {
      margin-top: 4px;
    }
    .colors-text {
      font-size: 13px;
      color: #495057;
      background: #e9ecef;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
    }
    .accordion-icon {
      font-size: 14px;
      color: #6c757d;
      transition: transform 0.2s ease;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .accordion-content {
      padding: 16px;
      background: white;
    }
    .variants-list {
      margin-bottom: 16px;
    }
    .color-separator {
      height: 2px;
      background: linear-gradient(to right, transparent, #CD844D, transparent);
      margin: 12px 0 8px 0;
      border-radius: 2px;
    }
    .variant-size-item {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .variant-size-item.new-color-group {
      margin-top: 4px;
    }
    .variant-size-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .variant-stock-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .variant-info-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 90px;
      flex-shrink: 0;
    }
    .variant-color {
      font-size: 13px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.2;
    }
    .variant-size {
      font-size: 11px;
      color: #6c757d;
      line-height: 1.2;
    }
    .stock-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 70px;
    }
    .stock-label {
      font-size: 10px;
      color: #6c757d;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }
    .stock-input {
      width: 100%;
      padding: 8px 6px;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      font-weight: 600;
      transition: all 0.2s ease;
      background: white;
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }
    .stock-input:focus {
      outline: none;
      border-color: #CD844D;
      box-shadow: 0 0 0 2px rgba(205, 132, 77, 0.1);
    }
    .stock-input::-webkit-outer-spin-button,
    .stock-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .accordion-actions {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e9ecef;
      display: flex;
      justify-content: center;
    }
    @media (min-width: 768px) {
      .variant-stock-row {
        gap: 12px;
      }
      .variant-info-left {
        min-width: 100px;
      }
      .stock-input-group {
        min-width: 80px;
      }
      .section-card {
        padding: 24px;
      }
    }
    .btn-complete {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      width: 100%;
      justify-content: center;
      min-height: 48px;
    }
    .btn-complete:hover {
      background: linear-gradient(135deg, #3d9be8 0%, #00d9e6 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
    }
    @media (min-width: 768px) {
      .btn-complete {
        width: auto;
      }
    }
    .btn-save {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-save:hover {
      background: linear-gradient(135deg, #5568d3 0%, #6a3f8f 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .btn-cancel {
      background: #6c757d;
      color: white;
    }
    .btn-cancel:hover {
      background: #5a6268;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 32px;
      border-radius: 16px;
      max-width: 800px;
      width: 90vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 24px;
      color: #2c3e50;
    }
    .close-btn {
      background: transparent;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #6c757d;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    .close-btn:hover {
      background: #f0f0f0;
      color: #333;
    }
    .tags-section {
      margin: 24px 0;
    }
    .tags-section label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #495057;
    }
    .tags-input {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #e9ecef;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tag-chip.selected {
      background: #CD844D;
      color: white;
    }
    .tag-chip:hover {
      transform: scale(1.05);
    }
    .variants-section {
      margin: 24px 0;
    }
    .variants-section h4 {
      margin: 0 0 16px 0;
      color: #495057;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e9ecef;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }
    .empty-state::before {
      content: "✅";
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
    }
    .message {
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .message.ok {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.err {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Productos Incompletos</h1>
      <p style="color: #6c757d; margin: 0;">Productos nuevos creados que aún no tienen stock contabilizado. Completá el stock y los tags para activarlos en el catálogo.</p>
      <div class="nav-bar">
        <a href="./index.html">← Volver al panel</a>
        <span style="flex:1 1 auto"></span>
        <a href="./products.html">Productos</a>
        <a href="./stock.html">Stock</a>
        <a href="./orders.html">Pedidos</a>
        <a href="./import-export.html">Importar/Exportar</a>
      </div>
    </div>

    <div id="message-container"></div>

    <section class="section-card">
      <h2>Calzado</h2>
      <div id="shoes-container"></div>
    </section>

    <section class="section-card">
      <h2>Ropa</h2>
      <div id="clothing-container"></div>
    </section>
  </div>


  <script type="module" src="../scripts/config.js?v=m260420"></script>
  <script type="module" src="../scripts/supabase-client.js?v=m260420"></script>
  <script type="module" src="./incomplete-products.js?v=m260420"></script>
</body>
</html>
