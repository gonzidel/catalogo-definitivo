    <style>
        /* Misma familia visual que index2: fondo claro, cards blancas, sombras suaves, #CD844D */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            background: #E5E1DC;
            min-height: 100vh;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 16px 20px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            border: 1px solid rgba(0,0,0,.06);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #CD844D;
        }
        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .dashboard-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .cart-section, .orders-section {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            border: 1px solid rgba(0,0,0,.06);
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #333;
            border-bottom: 1px solid rgba(205, 132, 77, 0.4);
            padding-bottom: 8px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: #fff;
            border: 1px solid rgba(0,0,0,.06);
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .cart-item img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
        }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .cart-item-details { font-size: 13px; color: #666; }
        .cart-item-price { font-size: 15px; font-weight: 600; color: #CD844D; }
        .cart-mini-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fff;
            margin-bottom: 14px;
            border: 1px solid rgba(0,0,0,.06);
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }
        .cart-mini-summary div { font-size: 14px; color: #333; }
        .cart-items-list { display: flex; flex-direction: column; gap: 10px; }
        .cart-mini-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #fff;
            align-items: center;
            border: 1px solid rgba(0,0,0,.06);
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }
        .cart-mini-thumb {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(0,0,0,.08);
            background: #f8f9fa;
        }
        .cart-mini-body { flex: 1; }
        .cart-mini-title { font-weight: 600; color: #333; margin-bottom: 4px; font-size: 14px; }
        .cart-mini-meta { font-size: 13px; color: #666; }
        .cart-mini-price { font-weight: 600; color: #CD844D; font-size: 14px; }
        .cart-mini-footer { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #555; text-align: right; }
        .cart-mini-remove {
            background: none;
            border: none;
            color: #c62828;
            font-size: 18px;
            cursor: pointer;
            margin-left: auto;
            align-self: flex-start;
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        .cart-mini-remove:hover { background: rgba(220, 53, 69, 0.1); }
        .empty-cart { text-align: center; padding: 28px 20px; color: #666; font-size: 14px; }
        .btn {
            background: #CD844D;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn:hover { background: #b8733a; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .order-item {
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            background: #fff;
            border: 1px solid rgba(0,0,0,.06);
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .order-status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .order-total {
            font-size: 18px;
            font-weight: bold;
            color: #CD844D;
        }
        .item-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .item-status-picked {
            background: #e6f4ea;
            color: #1b5e20;
        }
        .item-status-missing {
            background: #fdecea;
            color: #c62828;
        }
        .item-status-reserved {
            background: #fff3cd;
            color: #856404;
        }
        .item-missing {
            opacity: 0.7;
        }
        .item-missing .cart-mini-title,
        .item-missing .cart-mini-meta,
        .item-missing .cart-mini-price {
            text-decoration: line-through;
        }
        
        /* Productos agotados: chip/alert compacto */
        .cart-item-out-of-stock {
            background: #fff5f5 !important;
            border: 1px solid rgba(194, 24, 91, 0.35) !important;
            border-radius: 12px;
            padding: 12px;
        }
        .cart-item-out-of-stock .cart-mini-title { color: #c2185b; font-weight: 600; }
        .cart-item-out-of-stock .cart-mini-meta, .cart-item-out-of-stock .cart-mini-price { color: #ad1457; }
        
        .order-date-item {
            padding: 14px;
            background: #fff;
            border-radius: 12px;
            border-left: 3px solid #CD844D;
            border: 1px solid rgba(0,0,0,.06);
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            margin-bottom: 10px;
            transition: box-shadow 0.2s;
        }
        .order-date-item:hover { box-shadow: 0 2px 14px rgba(0,0,0,.08); }
        .order-date-item.expanded {
            border-color: rgba(205, 132, 77, 0.5);
            box-shadow: 0 2px 14px rgba(205, 132, 77, 0.15);
        }
        .order-date-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .order-date-item-header:hover {
            opacity: 0.8;
        }
        .order-date {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }
        .order-expand-icon {
            margin-left: 8px;
            font-size: 12px;
            color: #CD844D;
            transition: transform 0.2s;
            display: inline-block;
        }
        .order-date-item.expanded .order-expand-icon {
            transform: rotate(180deg);
        }
        .order-number {
            color: #CD844D;
            font-weight: 600;
            font-size: 14px;
        }
        .order-total {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }
        .order-items-detail {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px solid #eee;
        }
        .order-items-detail.visible {
            display: block;
        }
        .order-item-detail {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(0,0,0,.06);
        }
        .order-item-detail.missing {
            opacity: 0.6;
        }
        .order-item-detail-image {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .order-item-detail-info {
            flex: 1;
        }
        .order-item-detail-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #333;
        }
        .order-item-detail-meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .order-item-detail-price {
            font-weight: 600;
            font-size: 14px;
            color: #CD844D;
        }
        .order-item-detail-quantity {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .order-items-summary {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
            font-weight: 600;
            color: #333;
        }
        
        /* Historial (pantalla) — mantener compatibilidad, pero sin centrar ni limitar ancho */
        .previous-orders-modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 1200;
            overflow: hidden;
        }
        .previous-orders-modal.active {
            display: block;
            padding: 0;
        }
        .previous-orders-modal .modal-content-wrapper {
            background: #fff;
            border-radius: 0;
            padding: 0;
            max-width: none;
            width: 100%;
            height: 100%;
            max-height: none;
            overflow: hidden;
            box-shadow: none;
            border: 0;
        }
        .previous-orders-modal .modal-header-orders {
            display: grid;
            grid-template-columns: 44px 1fr;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(0,0,0,.08);
        }
        .previous-orders-modal .modal-header-orders h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 800;
            color: #333;
        }
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .order-highlight-new {
            animation: highlight-pulse 0.6s ease-out;
            box-shadow: 0 0 0 3px #CD844D !important;
        }
        @keyframes highlight-pulse {
            0% { box-shadow: 0 0 0 4px rgba(205, 132, 77, 0.8); }
            70% { box-shadow: 0 0 0 8px rgba(205, 132, 77, 0.2); }
            100% { box-shadow: 0 0 0 3px #CD844D; }
        }
        .dashboard-shortcuts {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            padding: 12px 14px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            border: 1px solid rgba(0,0,0,.06);
        }
        .dashboard-shortcuts a, .dashboard-shortcuts .btn-link {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            background: #f8f9fa;
            border: 1px solid rgba(0,0,0,.08);
        }
        .dashboard-shortcuts a:hover, .dashboard-shortcuts .btn-link:hover {
            background: #fff;
            border-color: #CD844D;
            color: #CD844D;
        }
        #dashboard-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 12px;
            padding: 12px 14px;
            background: #fff;
            border-radius: 16px;
            font-size: 13px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            border: 1px solid rgba(0,0,0,.06);
        }
        #dashboard-stats .stat-item { font-weight: 600; color: #333; }
        #confirm-submit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1050;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #confirm-submit-modal.active { display: flex; }
        #confirm-submit-modal .modal-content-wrapper {
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            border: 1px solid rgba(0,0,0,.06);
        }
        @media (max-width: 768px) {
            .dashboard-content {
                grid-template-columns: 1fr;
            }
            .dashboard-header {
                flex-direction: column;
                gap: 15px;
            }
        }
        @media (max-width: 430px) {
            .dashboard-shortcuts { gap: 8px; }
            .dashboard-shortcuts a, .dashboard-shortcuts .btn-link { padding: 6px 10px; font-size: 13px; }
        }
        
        /* Animación del spinner */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        body.dashboard-loading .dashboard-container,
        body.dashboard-loading .bottom-nav {
            visibility: hidden;
        }

        body.dashboard-loading {
            overflow: hidden;
        }
    </style>

</head>
<body class="dashboard-has-bottom-nav dashboard-loading">
    <!-- Loader -->
    <div id="loader" aria-busy="true" style="position: fixed; inset: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 99999;">
        <div style="text-align: center;">
            <div class="spinner" style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #CD844D; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
            <p style="color: #666; font-size: 16px;">Cargando tu área personal...</p>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="dash-account-row dash-card" role="region" aria-label="Cuenta">
            <div class="dash-account-row__left">
                <img id="user-avatar" class="dash-avatar-mini" src="" alt="" width="32" height="32">
                <span class="dash-account-row__greeting"><span id="user-name">Cargando...</span></span>
            </div>
            <div class="dash-account-row__right">
                <button type="button" id="header-notifications" class="dash-account-row__btn dash-header-notifications" title="Notificaciones" aria-label="Notificaciones">
                    <span class="dash-account-row__btn-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </span>
                    <span class="notification-badge" id="notification-badge" style="display: none;"></span>
                </button>
                <button type="button" id="dashboard-onboarding-trigger" class="dash-account-row__btn" aria-label="Cómo funciona el pedido"><span class="dash-account-row__btn-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></button>
                <button type="button" id="toggle-history-btn" class="dash-account-row__btn" aria-label="Historial de pedidos"><span class="dash-account-row__btn-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span></button>
                <button type="button" id="account-trigger" class="dash-account-row__btn" aria-label="Abrir menú de cuenta" aria-expanded="false" aria-haspopup="true" aria-controls="dash-account-sheet"><span class="dash-account-row__btn-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0a2.34 2.34 0 0 0 3.319 1.915a2.34 2.34 0 0 1 2.33 4.033a2.34 2.34 0 0 0 0 3.831a2.34 2.34 0 0 1-2.33 4.033a2.34 2.34 0 0 0-3.319 1.915a2.34 2.34 0 0 1-4.659 0a2.34 2.34 0 0 0-3.32-1.915a2.34 2.34 0 0 1-2.33-4.033a2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></span></button>
            </div>
        </div>
        <div id="dash-account-sheet" class="dash-account-sheet" role="dialog" aria-modal="true" aria-labelledby="dash-account-sheet-title" aria-hidden="true">
            <div class="dash-account-sheet__backdrop" id="account-sheet-backdrop" aria-hidden="true"></div>
            <div class="dash-account-sheet__panel">
                <div class="dash-account-sheet__body dash-account-sheet__body--menu">
                    <nav class="dash-account-sheet__nav" aria-label="Cuenta y enlaces">
                        <a href="profile.html" class="btn btn-ghost">👤 Perfil</a>
                        <button type="button" id="logout-btn" class="btn btn-danger">Cerrar sesión</button>
                    </nav>
                </div>
            </div>
        </div>
        <div id="dashboard-stats" class="dash-card dash-stats-hidden" aria-live="polite" aria-hidden="true"></div>

        <div class="dashboard-content">
            <!-- A: Pedido activo (orders.status=active) — primero -->
            <section id="section-active-order" class="section-pedido-activo orders-section dash-card" aria-label="Mi pedido">
                <div id="active-order-chips" class="active-order-chips" aria-live="polite"></div>
                <div id="orders-section">
                    <p class="empty-cart">No hay pedido activo</p>
                </div>
                <div id="active-order-actions" class="active-order-actions" style="display: none;"></div>
            </section>

            <!-- B: Carrito (cart abierto) — después -->
            <section id="section-bag" class="section-bolsa cart-section dash-card" aria-labelledby="title-bolsa">
                <div class="dash-bolsa-header-row">
                    <h2 id="title-bolsa" class="section-title dash-title">🛒 Carrito</h2>
                    <button type="button" id="clear-cart-btn" class="btn btn-ghost dash-bolsa-btn-clear">Limpiar carrito</button>
                </div>
                <div id="cart-info">
                    <p class="empty-cart">No hay items en el carrito</p>
                </div>
                <div id="cart-footer" class="dash-bolsa-footer" style="display: none;">
                    <div class="dash-bolsa-divider" aria-hidden="true"></div>
                    <div class="dash-bolsa-sticky-inner">
                        <div class="dash-bolsa-sticky__row1">
                            <span id="cart-products-count"></span>
                        </div>
                        <div class="dash-bolsa-sticky__row2">
                            <p class="dash-bolsa-total-line" id="cart-total-line">
                                <span class="dash-bolsa-total-price">
                                    Total: <span id="cart-total-value"></span>
                                </span>
                            </p>
                            <div id="cart-actions" class="dash-bolsa-actions">
                                <button type="button" id="submit-cart-btn" class="btn btn-primary dash-bolsa-btn-primary">Hacer pedido</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <div id="dash-sticky-bar" class="dash-sticky" style="display:none;" aria-hidden="true"></div>
    </div>

    <div id="notifications-backdrop" class="notifications-backdrop" aria-hidden="true"></div>
    <aside id="notifications-panel" class="notifications-panel" aria-hidden="true" aria-label="Notificaciones">
        <div class="notifications-panel__header">
            <div class="notifications-panel__title">Notificaciones</div>
            <button type="button" class="notifications-panel__close" id="notifications-close" aria-label="Cerrar">×</button>
        </div>
        <div class="notifications-panel__body">
            <div class="notifications-panel__empty" id="notifications-empty" style="display:none;">No tenés notificaciones.</div>
            <div class="notifications-panel__list" id="notifications-list"></div>
        </div>
