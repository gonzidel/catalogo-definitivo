<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>🏷️ Completar Tags - Producto Incompleto | Admin</title>
  <link rel="stylesheet" href="../styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .page-header {
      background: white;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .page-header h1 {
      margin: 0 0 16px 0;
      font-size: 32px;
      font-weight: 700;
      color: #2c3e50;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-header h1::before {
      content: "🏷️";
      font-size: 36px;
    }
    .nav-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding: 16px 0;
      border-top: 1px solid #e9ecef;
      margin-top: 16px;
    }
    .nav-bar a {
      color: #3a6df0;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .nav-bar a:hover {
      background: #f0f7ff;
    }
    .product-info {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .product-info h2 {
      margin: 0 0 12px 0;
      font-size: 24px;
      font-weight: 600;
      color: #2c3e50;
    }
    .product-info p {
      margin: 4px 0;
      color: #666;
      font-size: 14px;
    }
    .tags-section {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .tags-section h2 {
      margin: 0 0 24px 0;
      font-size: 24px;
      font-weight: 600;
      color: #2c3e50;
    }
    .card {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 16px;
      background: #fff;
      margin-bottom: 16px;
    }
    .card legend {
      padding: 0 8px;
      font-size: 14px;
      font-weight: 600;
      color: #2c3e50;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 600;
      font-size: 13px;
      color: #333;
    }
    input, select, textarea {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3a6df0;
      box-shadow: 0 0 0 2px rgba(58, 109, 240, 0.15);
    }
    small.hint {
      color: #666;
      font-size: 11px;
      line-height: 1.4;
      margin-top: 4px;
    }
    .btn {
      padding: 10px 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn:hover:not(:disabled) {
      background: #f8f9fa;
    }
    .btn.primary {
      background: #3a6df0;
      border-color: #2f5fe0;
      color: #fff;
    }
    .btn.primary:hover:not(:disabled) {
      background: #2f5fe0;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status-message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    #tag3-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #e8f4f8;
      border: 1px solid #b3d9e6;
      border-radius: 16px;
      font-size: 12px;
    }
    .tag-chip button {
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      font-size: 14px;
      padding: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tag-chip button:hover {
      color: #c33;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Completar Tags</h1>
      <p>Completa los tags jerárquicos del producto para activarlo</p>
      <div class="nav-bar">
        <a href="./index.html">← Volver al panel</a>
        <a href="./incomplete-products.html">Productos Incompletos</a>
        <a href="./products.html">Productos</a>
      </div>
    </div>

    <div id="product-info" class="product-info" style="display: none;">
      <h2 id="product-name"></h2>
      <p id="product-category"></p>
      <p id="product-handle"></p>
    </div>

    <div class="tags-section" id="tags-section" style="display: none;">
      <h2>Tags Jerárquicos</h2>
      
      <fieldset class="card">
        <legend>Tags Jerárquicos</legend>
        <div>
          <label style="grid-column: 1 / -1;">Tags Jerárquicos
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:6px;">
              <div>
                <label style="font-size:11px;color:#666;margin-bottom:2px;">Tags1 (Nivel 1)</label>
                <select id="tag1-select" style="width:100%;padding:5px;font-size:11px">
                  <option value="">-- Seleccionar Tags1 --</option>
                </select>
                <input type="text" id="tag1-new" placeholder="O crear nuevo..." style="width:100%;margin-top:3px;display:none;padding:4px;font-size:11px" />
                <button type="button" id="tag1-create" class="btn" style="margin-top:3px;display:none;width:100%;padding:4px 8px;font-size:11px">Crear Tags1</button>
              </div>
              <div>
                <label style="font-size:11px;color:#666;margin-bottom:2px;">Tags2 (Nivel 2)</label>
                <select id="tag2-select" style="width:100%;padding:5px;font-size:11px" disabled>
                  <option value="">-- Primero selecciona Tags1 --</option>
                </select>
                <input type="text" id="tag2-new" placeholder="O crear nuevo..." style="width:100%;margin-top:3px;display:none;padding:4px;font-size:11px" />
                <button type="button" id="tag2-create" class="btn" style="margin-top:3px;display:none;width:100%;padding:4px 8px;font-size:11px">Crear Tags2</button>
              </div>
              <div>
                <label style="font-size:11px;color:#666;margin-bottom:2px;">Tags3 (Nivel 3) - Máx 2</label>
                <select id="tag3-select" style="width:100%;padding:5px;font-size:11px" disabled multiple>
                  <option value="">-- Primero selecciona Tags2 --</option>
                </select>
                <input type="text" id="tag3-new" placeholder="O crear nuevo..." style="width:100%;margin-top:3px;display:none;padding:4px;font-size:11px" />
                <button type="button" id="tag3-create" class="btn" style="margin-top:3px;display:none;width:100%;padding:4px 8px;font-size:11px">Crear Tags3</button>
                <div id="tag3-chips" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;"></div>
              </div>
            </div>
            <small class="hint">Seleccioná Tags1, luego Tags2, y finalmente hasta 2 Tags3. Los Tags3 se pueden compartir entre diferentes Tags2 del mismo Tags1.</small>
          </label>
          <div style="margin-top:8px;padding:8px;background:#f0f7ff;border:1px solid #3a6df0;border-radius:4px;">
            <button type="button" id="auto-tags-btn" class="btn primary" style="width:100%;padding:8px;font-size:12px;">
              🤖 Auto-tags con IA
            </button>
            <span id="auto-tags-status" style="display:block;margin-top:6px;font-size:11px;color:#666;"></span>
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="button" id="cancel-btn" class="btn">Cancelar</button>
        <button type="button" id="save-btn" class="btn primary">
          💾 Guardar y Activar
        </button>
      </div>
      <div id="status-message"></div>
    </div>

    <div id="loading-state" class="empty-state">
      <div class="empty-state-icon">⏳</div>
      <p>Cargando producto...</p>
    </div>
  </div>

  <script type="module" src="../scripts/config.js"></script>
  <script defer src="../scripts/vendor/supabase-js.bundle.min.js?v=m260518"></script>
  <script type="module" src="../scripts/supabase-client.js"></script>
  <script type="module" src="./complete-incomplete-tags.js"></script>
</body>
</html>
