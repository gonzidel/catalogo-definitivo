<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>📏 Tablas de talles | Admin</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
    }
    .admin-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    .page-header, .section-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .page-header h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      color: #333;
    }
    .page-header p {
      margin: 0 0 16px 0;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }
    .nav-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding-top: 16px;
      border-top: 1px solid #e9ecef;
    }
    .nav-bar a {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }
    .nav-bar a:hover {
      border-color: #CD844D;
      color: #CD844D;
    }
    .list-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .list-toolbar .spacer { flex: 1 1 auto; }
    button {
      padding: 8px 14px;
      min-height: 40px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary {
      background: #CD844D;
      border-color: #CD844D;
      color: white;
    }
    .btn-primary:hover:not(:disabled) { background: #B8734A; }
    .btn-danger {
      color: #c0392b;
      border-color: #e6a39b;
    }
    .filter-group { display: flex; gap: 4px; }
    .filter-group button[aria-pressed="true"] {
      background: #333;
      border-color: #333;
      color: #fff;
    }
    .charts-table {
      width: 100%;
      border-collapse: collapse;
    }
    .charts-table th {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 2px solid #e9ecef;
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
    }
    .charts-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
      color: #333;
      vertical-align: middle;
    }
    .chart-name { font-weight: 600; }
    .chart-notes { color: #777; font-size: 12px; margin-top: 2px; }
    .status-badge {
      display: inline-block;
      border-radius: 10px;
      padding: 2px 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .status-complete { background: #dcfce7; color: #166534; }
    .status-draft { background: #fef3c7; color: #92400e; }
    .status-archived { background: #e5e7eb; color: #374151; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .message {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .loading, .empty-state {
      text-align: center;
      padding: 32px;
      color: #666;
    }
    @media (max-width: 640px) {
      .admin-container { padding: 16px 10px; }
      .charts-table thead { display: none; }
      .charts-table, .charts-table tbody, .charts-table tr, .charts-table td { display: block; width: 100%; box-sizing: border-box; }
      .charts-table tr { border: 1px solid #eee; border-radius: 10px; margin-bottom: 10px; padding: 8px; }
      .charts-table td { border: none; padding: 4px 4px; }
      .charts-table td[data-label]::before { content: attr(data-label) ": "; color: #777; font-size: 12px; }
      .row-actions { justify-content: stretch; }
      .row-actions button { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="page-header">
      <h1>Tablas de talles</h1>
      <p>Guías de medidas reutilizables para asignar a productos (principalmente calzado). Son orientativas: no cambian los talles a la venta, el stock ni los pedidos. Solo se puede asignar una tabla completa y activa.</p>
      <div class="nav-bar">
        <a href="./index.html">← Volver al panel</a>
        <span style="flex:1 1 auto"></span>
        <a href="./products.html">Productos</a>
      </div>
    </div>

    <div id="message-container"></div>

    <section class="section-card">
      <div class="list-toolbar">
        <div class="filter-group" role="group" aria-label="Filtrar tablas">
          <button type="button" data-filter="active" aria-pressed="true">Activas</button>
          <button type="button" data-filter="archived" aria-pressed="false">Archivadas</button>
        </div>
        <span class="spacer"></span>
        <button type="button" id="new-chart-btn" class="btn-primary" disabled>+ Nueva tabla</button>
      </div>
      <div id="charts-container">
        <div class="loading">Cargando tablas de talles…</div>
      </div>
    </section>
  </div>

  <script type="module" src="../scripts/config.js"></script>
  <script defer src="../scripts/vendor/supabase-js.bundle.min.js?v=m260607"></script>
  <script type="module" src="../scripts/supabase-client.js?v=m260607"></script>
  <script type="module" src="./size-charts.js?v=m260607"></script>
</body>
</html>
